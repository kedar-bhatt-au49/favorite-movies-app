services:
  - type: web
    name: favorite-movies-backend
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        # Add your MySQL connection string here
        # Format: mysql://username:password@host:port/database_name
        value: mysql://user:password@host:3306/favorite_movies
      - key: JWT_SECRET
        generateValue: true
