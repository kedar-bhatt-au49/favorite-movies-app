services:
  - type: web
    name: favorite-movies-backend
    env: node
    buildCommand: cd server && npm install && npx prisma generate && npm run build
    startCommand: cd server && npx prisma db push --accept-data-loss && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: favorite-movies-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: favorite-movies-db
    databaseName: favorite_movies
    user: favorite_movies_user
