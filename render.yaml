services:
  - type: web
    name: favorite-movies-backend
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        # Temporary - replace with your actual MySQL URL
        value: mysql://root:password@localhost:3306/favorite_movies
      - key: JWT_SECRET
        value: mySecretKey123ABC
